[package]
name = "transaction_solver"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A toy payments engine that applies a CSV transaction log to client accounts"
license = "MIT"
publish = false

[features]
# Allow withdrawals to be disputed. Off by default: see the README.
dispute-withdraw = []

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros"] }

[profile.release]
lto = true
codegen-units = 1

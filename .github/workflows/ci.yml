name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds both feature variants, runs the whole test suite inside each
      # derivation's check phase, and runs the clippy, rustfmt and nixfmt checks.
      # This is the same command a developer runs locally, so CI cannot disagree
      # with a clean working copy about whether the tree is green.
      - name: Build, test and lint on the pinned toolchain
        run: nix flake check --print-build-logs

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Deliberately not a flake check: fetching the advisory database needs
      # network access, and a build sandbox has none. The dev shell supplies
      # cargo-deny, so the version used here is still pinned by the flake.
      - name: Advisories, bans, licences and sources
        run: nix develop --command cargo deny check

  benchmark-smoke:
    name: benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The 16 MiB input, not the 100M-record default. The point is to prove the
      # generator and the benchmark wiring still work, not to measure anything: a
      # shared CI runner has too much variance to produce a number worth comparing,
      # and the real run belongs on a known machine. The runner's store is cold, so
      # this also builds the input from scratch and verifies its pinned hash — on a
      # different machine, with a different core count, which is exactly the case
      # the pinned xz block size exists to survive.
      - name: Generate and process a small input
        run: nix run .#bench-small
